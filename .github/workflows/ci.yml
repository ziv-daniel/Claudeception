name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check skill tooling syntax
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || '["self-hosted","linux","x64","homelab"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check skill tooling syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit.py
          bash -n scripts/claudeception-activator.sh
